services:
  mysql:
    # 服务器无法直连 Docker Hub，基础镜像由 Actions 同步到 ACR
    image: ${MYSQL_IMAGE:-crpi-bez2magwy58wcu7z.cn-hangzhou.personal.cr.aliyuncs.com/wuliu11/wuliu:mysql8}
    container_name: wuliu-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pwd_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-logistics}
      MYSQL_USER: ${MYSQL_USER:-logistics}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-logistics_pwd}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  wuliu:
    image: ${APP_IMAGE:-crpi-bez2magwy58wcu7z.cn-hangzhou.personal.cr.aliyuncs.com/wuliu11/wuliu:latest}
    container_name: wuliu-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "80:8000"
    env_file:
      - ./Backend_template/.env
    environment:
      PORT: "8000"
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-logistics}:${MYSQL_PASSWORD:-logistics_pwd}@mysql:3306/${MYSQL_DATABASE:-logistics}?charset=utf8mb4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  mysql-data:
