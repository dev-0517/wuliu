name: 物流系统 自动部署

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: wuliu-build
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  ACR_REPO: ${{ secrets.ACR_REPO }}

jobs:
  build:
    name: 云端构建并推送镜像
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 同步 MySQL 基础镜像到 ACR
        run: |
          set -e
          MYSQL_IMAGE="$ACR_REGISTRY/$ACR_NAMESPACE/$ACR_REPO:mysql8"
          if docker manifest inspect "$MYSQL_IMAGE" >/dev/null 2>&1; then
            echo "ACR 已存在 $MYSQL_IMAGE，跳过"
          else
            docker pull mysql:8.0
            docker tag mysql:8.0 "$MYSQL_IMAGE"
            docker push "$MYSQL_IMAGE"
            echo "SYNCED $MYSQL_IMAGE"
          fi

      - name: 构建并推送镜像
        run: |
          set -e
          TAG=$(git rev-parse --short HEAD)
          IMAGE="$ACR_REGISTRY/$ACR_NAMESPACE/$ACR_REPO:$TAG"
          LATEST="$ACR_REGISTRY/$ACR_NAMESPACE/$ACR_REPO:latest"
          echo "构建 $IMAGE"
          docker build -t "$IMAGE" .
          docker tag "$IMAGE" "$LATEST"
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "PUSHED $IMAGE"
